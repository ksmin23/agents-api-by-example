name: Publish Jupyter Book
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  UV_DEFAULT_INDEX: https://pypi.org/simple
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.17'
          enable-cache: true
      - name: Check public installation prerequisites
        run: python3 scripts/check_tutorial.py --require-public --require-repository
      - name: Check translation catalogs
        run: python3 scripts/localization.py
      - run: uv sync --locked --group dev --group docs
      - run: uv run --no-sync python scripts/configure_repository.py --check --require-repository
      - name: Build static site
        run: uv run --no-sync python scripts/build_artifacts.py --target pages
      - name: Check publication manifest
        run: uv run --no-sync python scripts/check_artifacts.py --target pages
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python scripts/check_notebooks.py --execute
      - run: uv run --no-sync python scripts/check_colab.py --execute --language all
      - name: Upload standalone Colab notebooks
        uses: actions/upload-artifact@v4
        with:
          name: colab-notebooks
          path: _build/colab/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/book/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
